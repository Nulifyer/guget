name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/verify.yml
    with:
      release-version: ${{ github.ref_name }}

  marketplace-preflight:
    name: Verify Marketplace publication
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check for extension changes
        id: changes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ] || ! git diff --quiet "$PREV_TAG" HEAD -- vscode-guget/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Verify Marketplace credentials
        if: steps.changes.outputs.changed == 'true'
        working-directory: vscode-guget
        run: |
          npm ci
          npx @vscode/vsce verify-pat nulifyer -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  release:
    name: Release
    needs: [verify, marketplace-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: guget/go.mod

      - name: Verify embedded release version
        working-directory: guget
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-X main.version=$VERSION" -o /tmp/guget-release-check .
          test "$(/tmp/guget-release-check version)" = "guget $VERSION"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vscode-extension:
    name: Publish VSCode Extension
    needs: [verify, marketplace-preflight, release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        if: needs.marketplace-preflight.outputs.changed == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Stamp version from tag
        if: needs.marketplace-preflight.outputs.changed == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd vscode-guget
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        if: needs.marketplace-preflight.outputs.changed == 'true'
        run: |
          cd vscode-guget
          npm ci

      - name: Verify Marketplace PAT
        if: needs.marketplace-preflight.outputs.changed == 'true'
        run: |
          cd vscode-guget
          npx @vscode/vsce verify-pat nulifyer -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Verify and package release extension
        if: needs.marketplace-preflight.outputs.changed == 'true'
        run: |
          cd vscode-guget
          npm run typecheck
          npm test
          npm audit --audit-level=moderate
          npm run package -- --out "$RUNNER_TEMP/guget-release.vsix"

      - name: Publish to Marketplace
        if: needs.marketplace-preflight.outputs.changed == 'true'
        run: |
          cd vscode-guget
          npx @vscode/vsce publish --packagePath "$RUNNER_TEMP/guget-release.vsix" -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
