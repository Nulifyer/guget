name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guget
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: guget/go.mod
          cache-dependency-path: guget/go.sum

      - name: Verify
        run: |
          go mod verify
          gofmt -w .
          git diff --exit-code
          go vet ./...
          go test ./...
          go test -race ./...

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: guget/go.mod

      - name: Verify embedded release version
        working-directory: guget
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-X main.version=$VERSION" -o /tmp/guget-release-check .
          test "$(/tmp/guget-release-check version)" = "guget $VERSION"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vscode-extension:
    name: Publish VSCode Extension
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Check for vscode-guget changes
        id: changes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PREV_TAG" HEAD -- vscode-guget/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 20

      - name: Stamp version from tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd vscode-guget
          npm pkg set version="$VERSION"

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd vscode-guget
          npm ci

      - name: Verify Marketplace PAT
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd vscode-guget
          npx @vscode/vsce verify-pat nulifyer -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Build extension
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd vscode-guget
          npm run build

      - name: Publish to Marketplace
        if: steps.changes.outputs.changed == 'true'
        run: |
          cd vscode-guget
          npx @vscode/vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
