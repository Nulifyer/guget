name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  nuget-and-projects:
    name: NuGet and public repository fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The dotnet comparison tests skip on macOS, where NuGet's
        # machine-wide folder cannot be moved.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    defaults:
      run:
        shell: bash
        working-directory: guget
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: guget/go.mod
          cache-dependency-path: guget/go.sum

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run integration tests
        run: go test -tags=integration -timeout=20m ./...
