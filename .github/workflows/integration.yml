name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  nuget-and-projects:
    name: NuGet and public repository fixtures
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guget
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: guget/go.mod
          cache-dependency-path: guget/go.sum

      - name: Set up .NET
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 10.0.x

      - name: Run integration tests
        run: go test -tags=integration -timeout=20m ./...
